name: Probe logos
on:
  push:
    branches: [main]
    paths: ['tools/probe/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow -q
      - run: python3 tools/probe/play.py tools/probe/play.txt > report.txt 2>&1 || true
      - run: |
          mkdir /tmp/r && cp report.txt /tmp/r/ && cd /tmp/r
          git init -q -b probe-logs && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "probe ${GITHUB_SHA}" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-logs
